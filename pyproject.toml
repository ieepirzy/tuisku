[project]
name = "tuisku"
version = "0.1.0"
description = "Open-source intrusion detection and agentic blue-team framework."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.30",
    "communityid>=1.5.0",
]

[project.scripts]
tuisku = "tuisku.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pyright>=1.1.380",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tuisku"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
