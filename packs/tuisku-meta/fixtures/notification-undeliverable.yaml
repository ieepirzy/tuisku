# `notifier_fails` makes the notifier refuse notifications of that kind (a test hook), with no
# backoff, until they have failed ten times; the meta-detection is then selected by this rule.
rule: tuisku-meta.notification_undeliverable
cases:
  - name: a page that keeps failing raises a meta-detection that pages elsewhere
    source: {adapter: harava}
    notifier_fails: incident_opened
    records:
      - at: "2026-11-01T09:14:04Z"
        raw: "2026-11-01 09:14:03,512 WARNING harava.api outbound data refused: caller=agents urls=1 findings=email/query/percent"
    fires: [harava.agent_outbound_refused, tuisku-meta.notification_undeliverable]
  - name: delivered pages raise nothing
    source: {adapter: harava}
    records:
      - at: "2026-11-01T09:14:04Z"
        raw: "2026-11-01 09:14:03,512 WARNING harava.api outbound data refused: caller=agents urls=1 findings=email/query/percent"
    fires: [harava.agent_outbound_refused]
