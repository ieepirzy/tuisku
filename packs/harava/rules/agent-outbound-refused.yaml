id: f542db3a-6926-4df9-9183-449491345d3c
rev: 1
name: harava.agent_outbound_refused
title: Agent caller had outbound data refused
description: >-
  Harava refused to fetch URLs that carried what looks like personal or secret data, for a
  restricted (agent) caller. Pages on every occurrence (issue #2).
severity: high
attack: [T1567]
select:
  layer: observation
  kind: harava.refusal
  where:
    - {field: attributes.type, op: eq, value: outbound}
    - {field: attributes.caller, op: in, value: {param: restricted_callers}}
finding:
  group_by: [attributes.caller]
  window: 1h
  max_lifetime: 24h
  notify: each
incident: open
