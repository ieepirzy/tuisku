id: 863883df-964f-47db-a78a-3de8558f9968
rev: 2
name: egress-guard.content_signals_likely_rise
title: Rise in content the egress gateway judged likely to carry instructions
description: >-
  The hourly sum of the gateway's content-signals counter (param content_signals_metric) with
  verdict="likely", against a multiple of the mean of the previous hours, never below a floor.
severity: medium
select:
  layer: observation
  kind: metric.sample
  where:
    - {field: attributes.metric, op: eq, value: {param: content_signals_metric}}
    - {field: attributes.labels.verdict, op: eq, value: likely}
correlation:
  type: baseline
  field: delta
  timespan: 1h
  baseline:
    windows: {param: likely_baseline_windows}
    factor: {param: likely_baseline_factor}
    floor: {param: likely_baseline_floor}
finding:
  group_by: [source]
  window: 6h
  max_lifetime: 7d
incident: none
