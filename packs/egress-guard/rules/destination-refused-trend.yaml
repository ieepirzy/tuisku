id: 48a5304d-2f64-4a94-8309-f348b42d6f13
rev: 2
name: egress-guard.destination_refused_trend
title: Destination refusals beyond admission are rising
description: >-
  The egress gateway logs destination refusals only at admission; the other stages (side
  requests, hops, discovery, render) are visible only in its destination-refused counter (param
  destination_refused_metric). Sums the counter's deltas per stage over an hour.
severity: medium
select:
  layer: observation
  kind: metric.sample
  where:
    - {field: attributes.metric, op: eq, value: {param: destination_refused_metric}}
    - {field: attributes.labels.stage, op: neq, value: admission}
correlation:
  type: value_sum
  field: delta
  timespan: 1h
  condition: {gte: {param: destination_trend_threshold}}
finding:
  group_by: [source, attributes.labels.stage]
  window: 6h
  max_lifetime: 7d
incident: none
