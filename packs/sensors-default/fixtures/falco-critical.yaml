    source: {adapter: falco}
    records:
      - at: "2026-10-30T12:00:01Z"
        raw: "{\"uuid\": \"5d0b0f8e-1b7a-4c1e-9d2a-2f0e6c1a9b01\", \"hostname\": \"node-1\", \"output\": \"12:00:00.123456789: Notice A shell was spawned in a container with an attached terminal (evt_type=execve user=root user_uid=0 process=sh proc_exepath=/bin/sh parent=runc command=sh terminal=34816 container_id=3ad7b26ded6d container_image=docker.io/library/nginx k8s_ns=default k8s_pod_name=web-1)\", \"priority\": \"Critical\", \"rule\": \"Terminal shell in container\", \"source\": \"syscall\", \"tags\": [\"T1059\", \"container\", \"maturity_stable\", \"mitre_execution\", \"shell\"], \"time\": \"2026-10-30T12:00:00.123456789Z\", \"output_fields\": {\"evt.time\": 1793361600123456789, \"evt.type\": \"execve\", \"container.id\": \"3ad7b26ded6d\", \"container.name\": \"web\", \"container.image.repository\": \"docker.io/library/nginx\", \"container.image.tag\": \"1.27\", \"proc.name\": \"sh\", \"proc.cmdline\": \"sh\", \"proc.pid\": 4242, \"proc.exepath\": \"/bin/sh\", \"proc.pname\": \"runc\", \"proc.ppid\": 4200, \"proc.tty\": 34816, \"user.name\": \"root\", \"user.uid\": 0, \"user.loginuid\": -1, \"k8s.ns.name\": \"default\", \"k8s.pod.name\": \"web-1\", \"proc.pid.ts\": 1793361590000000000, \"container.image.digest\": \"sha256:abababababababababababababababababababababababababababababababab\"}}"
