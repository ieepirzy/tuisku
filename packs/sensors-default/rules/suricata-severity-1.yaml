id: 6b04c7bd-b094-4ddf-b409-a32d2ec2a326
rev: 2
name: sensors-default.suricata_severity_1
title: Suricata alert with severity 1
description: The Suricata adapter maps alert severity 1, and only 1, to severity_id 4 (high).
severity: high
select:
  layer: detection
  kind: suricata.alert
  where:
    - {field: severity_id, op: eq, value: 4}
finding:
  group_by: [identity, entity_keys.0]
  window: 1h
  max_lifetime: 24h
incident: open
