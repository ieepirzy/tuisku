name: Image

# Build and publish the container image only after CI has passed on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-main
  cancel-in-progress: false

jobs:
  publish:
    # `branches` alone also matches a fork PR whose branch is named main, so
    # require a push event in this repository as well.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            TUISKU_BUILD_REVISION=${{ github.event.workflow_run.head_sha }}
          tags: |
            ghcr.io/ieepirzy/tuisku:sha-${{ github.event.workflow_run.head_sha }}
            ghcr.io/ieepirzy/tuisku:latest
          labels: |
            org.opencontainers.image.source=https://github.com/ieepirzy/tuisku
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.licenses=MIT
